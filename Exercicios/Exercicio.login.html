<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercicio Login</title>
    <link rel="stylesheet" href="./style/style.css">
</head>
<body>
 <h1>Exercícios login</h1>

    <div class="fundo">

        <div class="login-container">

            <h2>Login</h2>

            <form>

                <div class="campo">
                    <input type="email" placeholder="Email" required>
                </div>

                <div class="campo">
                    <input type="senha" placeholder="Senha" required>
                </div>

                <button type="submit">Login</button>

            </form>

            <p class="Esquecer">
                Esquecer <a href="#">Senha?</a>
            </p>

            <p class="entrar">
                Não tem uma conta? <a href="#">Criar uma: </a>
            </p>

        </div>

    </div>
    
</body>
</html>
